apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - issuer.yaml

patches:
  - target:
      kind: Ingress
      name: wisecow
    patch: |-
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
      - op: replace
        path: /spec/rules/0/host
        value: wisecow.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: wisecow.example.com
