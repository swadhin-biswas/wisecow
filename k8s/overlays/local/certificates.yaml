apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: wisecow-selfsigned
spec:
  selfSigned: {}
---
# A throwaway CA lets the local demo be verified with --cacert instead of -k.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wisecow-ca
  namespace: wisecow
spec:
  isCA: true
  commonName: wisecow local CA
  secretName: wisecow-ca
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: wisecow-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: wisecow-ca
  namespace: wisecow
spec:
  ca:
    secretName: wisecow-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wisecow-tls
  namespace: wisecow
spec:
  secretName: wisecow-tls
  commonName: wisecow.local
  dnsNames:
    - wisecow.local
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: wisecow-ca
    kind: Issuer
