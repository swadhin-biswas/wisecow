apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisecow
  labels:
    app.kubernetes.io/name: wisecow
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wisecow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wisecow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wisecow
          image: ghcr.io/swadhinbiswas/wisecow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4499
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            # wisecow.sh creates a fifo in its working directory
            - name: workdir
              mountPath: /app
      volumes:
        - name: workdir
          emptyDir: {}
