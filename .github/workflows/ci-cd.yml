name: ci-cd

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Lint the Dockerfile
        run: |
          curl -fsSLo /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          chmod +x /tmp/hadolint
          /tmp/hadolint --failure-threshold error Dockerfile

      - name: Check Python syntax
        run: python3 -m compileall -q scripts tests

      - name: Run the tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate the Kubernetes manifests
        run: |
          curl -fsSLo /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          /tmp/kubeconform -strict -ignore-missing-schemas -summary \
            -kubernetes-version 1.33.0 k8s/base k8s/overlays

  build:
    name: build image
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

  smoke:
    name: deploy smoke test
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: smoke-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install kind and helm
        run: |
          if ! command -v kind >/dev/null 2>&1; then
            curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
            sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          fi
          if ! command -v helm >/dev/null 2>&1; then
            curl -fsSLo /tmp/helm.tar.gz https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
            tar -xzf /tmp/helm.tar.gz -C /tmp
            sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          fi
          kind version
          helm version --short

      - name: Create the cluster and add-ons
        run: CLUSTER=smoke make cluster-up

      - name: Apply the overlay with the published digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "unexpected digest from the build job: '${DIGEST}'" >&2
            exit 1
          fi
          kubectl kustomize k8s/overlays/local \
            | sed -E "s#image: (wisecow:local|ghcr\.io/[^[:space:]]+)#image: ${IMAGE}@${DIGEST}#" \
            | kubectl apply -f -
          kubectl -n wisecow rollout status deployment/wisecow --timeout=180s
          kubectl -n wisecow wait --for=condition=Ready certificate/wisecow-tls --timeout=180s

      - name: Verify HTTPS
        run: make verify

      - name: Show the deployed state
        if: always()
        run: |
          kubectl -n wisecow get pods,svc,ingress,certificate -o wide || true
          kubectl -n wisecow get deploy wisecow \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}' || true

      - name: Clean up
        if: always()
        run: kind delete cluster --name smoke || true

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Apply the manifests and pin the digest
        env:
          OVERLAY: ${{ vars.DEPLOY_OVERLAY || 'prod' }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          case "$OVERLAY" in
            local | prod) ;;
            *)
              echo "DEPLOY_OVERLAY must be local or prod, got '${OVERLAY}'" >&2
              exit 1
              ;;
          esac
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "unexpected digest from the build job: '${DIGEST}'" >&2
            exit 1
          fi
          kubectl kustomize "k8s/overlays/${OVERLAY}" \
            | sed -E "s#image: (wisecow:local|ghcr\.io/[^[:space:]]+)#image: ${IMAGE}@${DIGEST}#" \
            | kubectl apply -f -

      - name: Wait for the rollout
        run: kubectl -n wisecow rollout status deployment/wisecow --timeout=180s

      - name: Add a run summary
        env:
          HOST: ${{ vars.WISECOW_HOST }}
        run: |
          if [[ -n "$HOST" ]]; then
            printf 'Deployed https://%s/\n' "$HOST" >> "$GITHUB_STEP_SUMMARY"
          fi
